openapi: 3.2.0
info:
  title: "Mint Page"
  version: "0.0.1"
  description:
    REST API for user authentication and management of boards, columns, cards,
    labels and board members.
servers:
  - url: "http://localhost:5000/v1"
    description: Development

tags:
  - name: Auth
    description: Registration, login, session and password management
  - name: Boards
    description: Board creation and management
  - name: Board Members
    description: Managing who has access to a board and their role
  - name: Lists
    description: Columns within a board
  - name: Cards
    description: Cards within a list
  - name: Labels
    description: Labels defined on a board
  - name: Card Labels
    description: Assigning board labels to individual cards

security:
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"

      responses:
        "201":
          description: User Registered Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: Username or email already in use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation Failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TooManyRequests"
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User Logged in Successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session_id=abcde12345; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=3600
              description: httpOnly session cookie used for subsequent authenticated requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Invalid Credentials
          content:
            application/problem+json:
              schema:
              $ref: "#/components/schemas/Problem"
        "403":
          description: Account email has not been verified
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation Failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TooManyRequests"
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify a user's email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "410":
          description: Verification token expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation Failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an expired or missing Access Token
      security:
        - sessionAuth: []
      responses:
        "200":
          description: New Access Token issued
          headers:
            Set-Cookie:
              description: Rotated Access Token and Session Token cookies
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Session Token missing, invalid, expired or revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/request-reset-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"

      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

        "422":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TooManyRequests"
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Confirm a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetRequest"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Reset token expired or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed, or the new password is the same as the current password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TooManyRequests"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current session
      description: Revokes the current Session Token and clears both cookies.
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  schemas:
    #Requests
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: Passwords must be at least 8 characters long and contain at least one number and one special character
      required: [username, email, password]
    LoginRequest:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
        minLength: 8
        maxLength: 100
        description: Passwords must be at least 8 characters long and contain at least one number and one special character
      required: [email, password]

    # Reponses
    SuccessResponse:
      type: object
      description: Non-error RFC 9457-shaped response used for simple success
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [title, status, detail, instance]
    # Problems
    Problem:
      type: object
      description: RFC 9457 Problem Details object.
      properties:
        title:
          type: string
          description: Short, human-readable summary that does not change between occurrences
        status:
          type: integer
          description: HTTP status code for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
      required: [title, status, detail, instance]
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
      type: object
      description: Field Validation Problem object
      properties:
        error:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required: [field, message]
      required: [errors]
